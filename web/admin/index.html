<!doctype html>
<html lang="es-CO">
<head>

  <meta name="theme-color" content="#d8287f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Panel de administrador · Cholados La India</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="../assets/fonts/fredoka-600.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../css/panel.css">
</head>
<body>
  <header class="franja">
    <div>
      <h1>Panel de administrador</h1>
      <small>Cholados La India</small>
    </div>
    <div id="quien" class="quien" hidden></div>
  </header>
  <div id="demo" class="demo" hidden></div>
  <nav id="pestanas" class="pestanas" role="tablist" aria-label="Secciones del panel" hidden></nav>
  <main id="app" class="pagina ancha"></main>

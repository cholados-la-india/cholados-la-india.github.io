  <link rel="preload" href="assets/marca/logo.png" as="image">
  <link rel="stylesheet" href="css/juego.css">
  <!-- Precarga de los módulos: sin esto el navegador descubre los archivos de a uno (main → escena → three…) y en 4G se pierde
       cerca de un segundo en viajes de ida y vuelta. Con esto se piden todos a la vez. (Si agregas o renombras un módulo en js/,
       actualiza esta lista; si falta alguno, el juego funciona igual, solo carga más lento.) -->
  <link rel="modulepreload" href="vendor/three/three.min.js">
  <link rel="modulepreload" href="js/game/escena.js">
  <link rel="modulepreload" href="js/game/modelos.js">
  <link rel="modulepreload" href="js/game/modelos-nivel.js">
  <link rel="modulepreload" href="js/game/materiales.js">
  <link rel="modulepreload" href="js/game/matcap.js">

  <link rel="modulepreload" href="js/game/logica.js">
  <link rel="modulepreload" href="js/game/controles.js">
  <link rel="modulepreload" href="js/ui/ui.js">

  <link rel="modulepreload" href="js/api-supabase.js">
  <link rel="modulepreload" href="js/api-falsa.js">

<body>
  <main id="escena" class="escena">
    <canvas id="lienzo" role="img" aria-label="El juego: el personaje corre por una calle de frutas"></canvas>
    <div id="golpe" class="golpe" aria-hidden="true"></div>
    <div id="hud" class="hud" hidden></div>
    <div id="cuenta" class="cuenta" aria-live="assertive" hidden></div>
    <!-- Lo primero que se ve, sin esperar a ningún JavaScript: el logo y «Cargando…» (main.js lo reemplaza con el inicio) -->
    <div id="pantalla" class="capa"><section class="pantalla centro"><div class="panel cargando-inicial"><img class="logo" src="assets/marca/logo.png" alt="Cholados La India" width="380" height="157"><p class="mensaje" role="status">Cargando…</p></div></section></div>
    <p id="sin-webgl" class="sin-webgl" hidden>Este navegador no puede mostrar el juego. Ábrelo en Chrome o Safari (en Instagram o Facebook: los tres puntos → «Abrir en el navegador»).</p>
  </main>
  <div id="gira" class="gira" role="status"></div>
  <noscript><p style="padding:24px;font:16px system-ui">Para jugar necesitas activar JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
  <!-- Navegadores tan viejos que no entienden módulos: al menos que digan qué hacer en vez de dejar el cielo vacío -->
  <script nomodule>document.getElementById('sin-webgl').hidden = false;</script>
</body>
</html>
